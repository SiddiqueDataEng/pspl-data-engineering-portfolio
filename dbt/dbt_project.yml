name: pspl
version: "1.0.0"
config-version: 2

profile: pspl

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
analysis-paths: ["analyses"]
seed-paths: ["seeds"]
snapshot-paths: ["snapshots"]
docs-paths: ["docs"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  pspl:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: table
